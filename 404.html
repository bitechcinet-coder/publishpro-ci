<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page non trouvée | PublishPro CI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #1A1A2E, #16213E);
        }
        .error-code { font-size: 8rem; font-weight: 900; color: var(--color-primary); line-height: 1; margin-bottom: 1rem; }
        .error-page h1 { color: white; font-size: 2rem; margin-bottom: 1rem; }
        .error-page p { color: rgba(255,255,255,0.7); margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="error-page">
        <div>
            <div class="error-code">404</div>
            <h1>Page non trouvée</h1>
            <p>Désolé, cette page n'existe pas ou a été déplacée.</p>
            <a href="/" class="btn btn-primary">← Retour à l'accueil</a>
        </div>
    </div>
</body>
</html>
